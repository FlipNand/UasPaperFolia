[versions]
# Netty: compile-only for every module. The Paper server supplies Netty at runtime,
# so the compile version must be <= the server's Netty version.
netty = "4.2.16.Final"
gson = "2.14.0"
junit = "5.11.4"
# Paper 26.3 (1.20.4+ protocol line). Compile-only: provided by the server.
paper = "26.3.build.169-beta"
# Geyser extension API, 26.3 preview line. Snapshot versions are the only ones
# Geyser publishes for preview branches, so the exact build this code was written
# against is recorded here and in the README:
#   api-preview-feature-26.3-20261010.151726-18 (build 18)
geyser = "preview-feature-26.3-SNAPSHOT"

[libraries]
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
geyser-api = { module = "org.geysermc.geyser:api", version.ref = "geyser" }

[bundles]
netty = ["netty-buffer", "netty-transport", "netty-codec", "netty-codec-http", "netty-handler"]
